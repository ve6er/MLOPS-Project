name: CI - Train and Version Model

on:
  push:
    branches:
      - master
    # FIX 1: Only run this workflow if training-related files are pushed.
    # This prevents an infinite loop when the bot pushes the dvc.lock file.
    paths:
      - 'src/**'
      - 'data/**'
      - 'params.yaml'
      - '.github/workflows/cicd.yml' # Lets you update the workflow itself
  pull_request:
    branches:
      - master
    # Also check PRs for changes to these files
    paths:
      - 'src/**'
      - 'data/**'
      - 'params.yaml'
      - '.github/workflows/cicd.yml'

jobs:
  run-pipeline:
    # Don't run on commits from the bot (an extra layer of safety)
    if: "!contains(github.event.head_commit.message, 'ci: [Auto]')"
    
    runs-on: ubuntu-latest
    # The 'permissions:' block is no longer needed because the PAT_TOKEN provides permissions
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        # FIX 2: Use a Personal Access Token (PAT)
        # This allows the bot's commit to trigger your 'deploy.yaml' workflow
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11' 

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup DVC
        uses: iterative/setup-dvc@v1

      - name: Pull DVC Cache
        run: |
          dvc pull data/raw/global-data-on-sustainable-energy.csv.dvc -r mlops_remote
          # Pull existing model. If it fails (|| true), that's okay (handles the "broken promise" error)
          dvc pull model/model.pkl -r mlops_remote --force || true
          
      - name: Reproduce the full pipeline
        run: |
          dvc repro
          
      - name: Show DVC experiments
        run: |
          dvc exp show
          
      - name: Push new artifacts to S3
        run: |
          dvc push -r mlops_remote
          
      - name: Commit DVC lock files
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git add dvc.lock
          
          # --- THIS IS THE FIX ---
          # Commit. If it fails (because no changes), then run `git reset`
          # This unstages dvc.lock, cleaning the working tree.
          git commit -m "ci: [Auto] Update dvc.lock with new model/data" || git reset
          git stash
          # Now the staging area is clean and this command will work
          git pull --rebase
          
          # Now the push will succeed
          git push