name: CI - Train and Version Model

on:
  push:
    branches:
      - master
    # --- NEW: This job will ONLY run if these files change ---
    paths:
      - 'src/**'
      - 'data/raw/**'
      - 'params.yaml'
  pull_request:
    branches:
      - master
    paths:
      - 'src/**'
      - 'data/raw/**'
      - 'params.yaml'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    # --- NEW: This 'if' check prevents the bot from re-triggering itself ---
    if: "contains(github.event.head_commit.message, '[Auto]') == false"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11' 

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup DVC
        uses: iterative/setup-dvc@v1

      - name: Pull DVC Cache
        run: |
          # Pull the raw data to start the pipeline
          dvc pull data/raw/global-data-on-sustainable-energy.csv.dvc -r mlops_remote
          # Pull the existing model to compare against (for select_best_model.py)
          dvc pull model/model.pkl.dvc -r mlops_remote --force
          
      - name: Reproduce the full pipeline
        run: |
          # This runs all stages and selects the best model
          dvc repro
          
      - name: Show DVC experiments
        run: |
          dvc exp show
          
      - name: Push new artifacts to S3
        run: |
          # Push all new data, artifacts, and models to S3
          dvc push -r mlops_remote
          
      - name: Commit DVC lock files
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git add dvc.lock
          
          # Use a special commit message that our 'if' condition can check
          git commit -m "ci: [Auto] Update dvc.lock with new model/data" || echo "No changes to commit"
          
          git push
