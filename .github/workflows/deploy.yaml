name: CD - Build and Deploy to EC2

on:
  # --- TRIGGER 1: Runs after the CI (training) pipeline succeeds ---
  workflow_run:
    workflows: ["CI - Train and Version Model"] # <-- Match the new name
    types:
      - completed
      
  # --- TRIGGER 2: Runs if ONLY the app code changes ---
  push:
    branches:
      - master
    paths:
      - 'app.py'
      - 'Dockerfile'
      - '.dockerignore'
      - 'requirements.txt'
      - 'templates/**'

jobs:
  build-and-deploy:
    # --- NEW: This job now runs if EITHER trigger fires successfully ---
    # 1. Runs if CI pipeline (workflow_run) was successful
    # 2. Runs if the event was a 'push' (for app code) AND it wasn't a bot commit
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'push' && !contains(github.event.head_commit.message, '[Auto]'))
    
    runs-on: ubuntu-latest
    
    env:
      IMAGE_NAME_AND_TAG: my-ml-api:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          
      - name: Setup DVC
        uses: iterative/setup-dvc@v1

      - name: Pull artifacts from DVC
        run: |
          # This is the key step:
          # If triggered by CI, this pulls the NEW model.
          # If triggered by App Push, this pulls the CURRENT model.
          # Either way, it gets the correct versioned model.
          dvc pull -r mlops_remote --force
          
      - name: Build Docker image
        run: |
          docker build --no-cache -t $IMAGE_NAME_AND_TAG .

      - name: Save Docker image to a tar file
        run: |
          docker save $IMAGE_NAME_AND_TAG -o image.tar

      - name: Upload image to S3
        run: |
          aws s3 cp image.tar s3://${{ secrets.AWS_S3_BUCKET }}/${{ secrets.S3_IMAGE_KEY }}
          echo "Image tarball uploaded to S3 bucket."

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }} # <-- Make sure this secret is EC2_USER
          key: ${{ secrets.EC2_KEY }}
          port: 22
          script: |
            # --- START: Swap space (good practice) ---
            if [ -f /swapfile ]; then
              echo "Swap file already exists."
            else
              echo "Creating 2GB swap file..."
              sudo fallocate -l 2G /swapfile
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
              echo "Swap file created and enabled."
            fi
            # --- END: Swap space ---

            echo "Cleaning up Docker to free space..."
            sudo docker system prune -af
            
            # Set variables
            S3_PATH="s3://${{ secrets.AWS_S3_BUCKET }}/${{ secrets.S3_IMAGE_KEY }}"
            LOCAL_IMAGE_FILE="$HOME/image.tar"
            IMAGE_TAG_TO_RUN="${{ env.IMAGE_NAME_AND_TAG }}"
            
            echo "Downloading new image from $S3_PATH to $LOCAL_IMAGE_FILE"
            aws s3 cp $S3_PATH $LOCAL_IMAGE_FILE --region ${{ secrets.AWS_REGION }}
            
            echo "Loading image into Docker"
            sudo docker load -i $LOCAL_IMAGE_FILE
            
            echo "Stopping and removing old container..."
            sudo docker stop ml-api-container || true
            sudo docker rm ml-api-container || true
            
            echo "Running new container..."
            sudo docker run -d --name ml-api-container --restart always -p 80:5000 $IMAGE_TAG_TO_RUN
            
            echo "Cleaning up local tar file"
            rm $LOCAL_IMAGE_FILE
